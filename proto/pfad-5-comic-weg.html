<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE600">
<title>Pfad-Entwurf 5 · Comic-Weg</title>
<link rel="stylesheet" href="proto.css">
<style>
/* Idee: Comic + klarer Weg. Eine dicke Comic-Straße schlängelt sich von Panel zu Panel.
   Jedes Panel ist eine Station am Weg, mit Nummernschild an der Straße.
   Auf dem Stück zum nächsten „?“ zeigen Rauten die Siege, der Klecks läuft mit. */
body{background:#FFE600}
.page{position:relative;padding:calc(16px + env(safe-area-inset-top)) 14px calc(130px + env(safe-area-inset-bottom))}
.road{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible;z-index:0}
.cover{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:0}
.cover .h{font-size:40px}
.cover .h small{display:block;font-size:13px;letter-spacing:.14em;margin-bottom:4px;font-family:'Space Grotesk';font-weight:700}
.cover .issue{border:3px solid #000;padding:4px 8px;font-family:'Archivo Black';font-size:13px;transform:rotate(4deg);background:#fff;box-shadow:3px 3px 0 #000}
.prolog{position:relative;z-index:1;background:#000;color:#fff;border:4px solid #000;padding:16px;margin-top:18px;width:86%;font-size:14px;line-height:1.5;box-shadow:6px 6px 0 #FF2E88}
.prolog b{font-family:'Archivo Black';color:#FFE600;display:block;font-size:18px;text-transform:uppercase;margin-bottom:4px}
.stop{position:relative;z-index:1;width:86%;margin-top:96px;transform:rotate(var(--r))}
.stop.r{margin-left:14%}
.strip{display:grid;grid-template-columns:1.35fr 1fr;border:4px solid #000;background:#000;gap:4px;box-shadow:7px 7px 0 var(--c)}
.stop.r .strip{grid-template-columns:1fr 1.35fr}
.stop.r .strip .art{order:2}
.art{position:relative;min-height:150px;border:0;padding:0;background:#fff;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.txt{position:relative;background:var(--c);color:#fff;padding:12px 10px;font-weight:700;font-size:12.5px;line-height:1.36;text-transform:uppercase;display:flex;align-items:flex-end}
.txt.light{color:#000}
.txt::before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.18) 1.2px,transparent 1.6px) 0 0/7px 7px}
.txt span{position:relative}
.cap{position:absolute;left:-4px;top:-4px;background:#FFE600;border:3px solid #000;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;z-index:2}
.stop.splash .strip{grid-template-columns:1fr}
.splash .art{min-height:210px}
.bubble{position:absolute;right:10px;bottom:12px;max-width:72%;background:#fff;border:3px solid #000;border-radius:20px;padding:8px 11px;font-weight:700;font-size:12px;line-height:1.3;text-transform:uppercase;z-index:2}
.bubble::after{content:'';position:absolute;right:26px;bottom:-14px;width:18px;height:18px;background:#fff;border-right:3px solid #000;border-bottom:3px solid #000;transform:skewX(-30deg) rotate(30deg)}
.sign{position:absolute;top:-30px;width:46px;height:46px;border-radius:50%;background:#fff;border:4px solid #000;display:grid;place-items:center;font-family:'Archivo Black';font-size:18px;z-index:3;box-shadow:3px 3px 0 #000}
.stop .sign{left:18%}.stop.r .sign{left:auto;right:18%}
.done .sign{background:#000;color:#FFE600}
.stop.next{margin-top:190px}
.next .sign{background:#FF2E88;color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.stop.next .strip{grid-template-columns:1fr;background:#FF2E88;box-shadow:7px 7px 0 #000}
.nextin{position:relative;min-height:150px;display:grid;place-items:center;text-align:center;color:#fff;cursor:pointer;border:0;background:#FF2E88;padding:0}
.nextin::before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.2) 2px,transparent 2.5px) 0 0/9px 9px}
.nextin div{position:relative}.nextin .h{font-size:56px}
.nextin small{display:block;font-weight:700;font-size:12px;letter-spacing:.1em;margin-top:4px}
.stop.lock .strip{grid-template-columns:1fr 1fr;box-shadow:5px 5px 0 rgba(0,0,0,.35);opacity:.9}
.lock .art,.lock .txt{background:#111;min-height:110px}
.lock .art::before{content:'???';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:'Archivo Black';font-size:26px;background:radial-gradient(#333 1.5px,transparent 2px) 0 0/8px 8px}
.lock .sign{background:#fff;color:#000;opacity:.6;border-style:dashed}
.tbc{position:relative;z-index:1;text-align:center;font-family:'Archivo Black';font-size:16px;text-transform:uppercase;margin-top:70px}
.klecks{position:absolute;width:54px;height:54px;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
.klecks svg{width:100%;height:100%;filter:drop-shadow(3px 3px 0 #000);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(6deg)}}
.boom{position:absolute;left:6px;bottom:6px;z-index:3;width:120px;height:80px;animation:boom .7s cubic-bezier(.2,1.8,.4,1) .3s both}
.boom svg{width:100%;height:100%;overflow:visible}
@keyframes boom{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(-6deg)}}
.new{animation:panelIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes panelIn{from{transform:translateY(30px) rotate(-4deg);opacity:0}}
/* ===== Mikroanimationen ===== */
.mo .stop{opacity:0;transform:translateY(34px) rotate(calc(var(--r) + var(--tilt,-4deg))) scale(.96);transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.5,.4,1)}
.mo .stop.r{--tilt:4deg}
.mo .stop.in{opacity:1;transform:rotate(var(--r))}
.mo .stop .sign{transform:scale(0) rotate(-90deg);transition:transform .5s cubic-bezier(.2,1.8,.4,1) .35s}
.mo .stop.in .sign{transform:none}
.mo .stop.next.in .sign{animation:pulse 1.2s ease-in-out 1s infinite}
.mo .cap{transform:translateX(-14px);opacity:0;transition:transform .4s cubic-bezier(.2,1.5,.4,1) .45s,opacity .3s .45s}
.mo .stop.in .cap{transform:none;opacity:1}
.mo .bubble{transform:scale(0);transform-origin:85% 110%;transition:transform .45s cubic-bezier(.2,1.8,.4,1) .7s}
.mo .stop.in .bubble{transform:none}
.mo .txt span{opacity:0;transform:translateY(8px);transition:opacity .4s .5s,transform .4s .5s}
.mo .stop.in .txt span{opacity:1;transform:none}
.mo .art img{transform:scale(1.12);transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .2s}
.mo .stop.in .art img{transform:scale(1)}
.art:active,.nextin:active{transform:translate(3px,3px)}
.stop.done .strip,.stop.next .strip{transition:box-shadow .15s}
.stop.done:active .strip{box-shadow:3px 3px 0 var(--c)}
.nextin .h{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.nextin::before{animation:dots 6s linear infinite}
@keyframes dots{to{background-position:90px 45px}}
#cur{animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
.dia{transform-box:fill-box;transform-origin:center;animation:diaIn .45s cubic-bezier(.2,1.8,.4,1) both}
.dia.now{animation:diaIn .45s cubic-bezier(.2,1.8,.4,1) both,diaPulse 1.1s ease-in-out 1s infinite}
@keyframes diaIn{from{transform:scale(0) rotate(-90deg)}}
@keyframes diaPulse{50%{transform:scale(1.25)}}
.klecks{cursor:pointer;pointer-events:auto}
.klecks .eyes{animation:blink 4s infinite;transform-origin:center 21px;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.klecks.squish svg{animation:squish .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes squish{30%{transform:scale(1.3,.7)}60%{transform:scale(.85,1.2)}}
.say{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-6px) scale(0);transform-origin:50% 100%;background:#fff;border:3px solid #000;border-radius:14px;padding:4px 9px;font-weight:700;font-size:12px;white-space:nowrap;text-transform:uppercase;transition:transform .35s cubic-bezier(.2,1.8,.4,1)}
.say.on{transform:translate(-50%,-6px) scale(1)}
.boom svg{animation:shake .5s ease-in-out 1s 2}
@keyframes shake{25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
.ink{position:absolute;width:10px;height:10px;border-radius:50%;background:#000;z-index:5;pointer-events:none}
.tbc span{animation:tbc 1.4s steps(4) infinite;display:inline-block;width:1.2em;overflow:hidden;vertical-align:bottom;white-space:nowrap}
@keyframes tbc{from{width:0}to{width:1.2em}}
.measure .stop{transform:rotate(var(--r))!important;transition:none!important}.measure .stop .sign{transform:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.mo .stop,.mo .stop *{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<main class="page" id="page"></main>
<script src="../content.js?v=223"></script>
<script src="proto.js"></script>
<script>
const NEED=[2,3,3,4,4,5,5,6];
const KL='<svg viewBox="0 0 46 46"><path d="M23 4c9 0 12 6 17 9s5 13 1 18-7 11-16 11S8 40 5 34 1 20 6 14 14 4 23 4z" fill="#FF2E88" stroke="#000" stroke-width="3"/><g class="eyes"><circle cx="17" cy="21" r="4.5" fill="#fff" stroke="#000" stroke-width="2.5"/><circle cx="29" cy="21" r="4.5" fill="#fff" stroke="#000" stroke-width="2.5"/><circle cx="18" cy="22" r="1.8"/><circle cx="30" cy="22" r="1.8"/></g><path d="M18 31q5 4 10 0" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/></svg>';
const BOOM=w=>'<div class="boom"><svg viewBox="0 0 130 86"><path d="M65 2l9 18 20-12-2 22 26-4-14 18 24 10-24 8 12 18-24-4 2 18-20-12-11 16-9-18-20 12 2-22-24 4 14-18L2 46l24-8L14 20l24 4-2-18 20 12z" fill="#fff" stroke="#000" stroke-width="3.5"/><text x="65" y="53" text-anchor="middle" font-family="Archivo Black" font-size="22">'+w+'</text></svg></div>';
const WORDS=['PLOPP!','SPLASH!','WUSCH!','TATAA!','KLECKS!'];
const first=s=>s.split(/(?<=[.!?])\s/)[0];
const WINS=2; // Demo: so viele Siege schon auf dem Weg zum nächsten Bild
let hopFrom=false,sayI=0;const SAYS=['Weiter!','Noch '+'ein Sieg!','Hui!','Da vorne!','Prüfung!'];
function render(isNew){hopFrom=!!isNew;
  let h='<svg class="road" id="road" aria-hidden="true"></svg>';
  h+='<div class="cover"><div class="h"><small>Die Abenteuer von</small>Klecks</div><div class="issue">Heft 1 · '+U+'/'+N+'</div></div>';
  h+='<div class="prolog" id="s-1"><b>Es war einmal …</b>'+PROLOG+'</div>';
  const last=Math.min(N-1,U+2);
  for(let i=0;i<=last;i++){const side=i%2?'':' r',r=((i*37)%5-2)*.6+'deg',c=col(i),nw=isNew&&i===U-1?' new':'';
    if(i<U){const light=['#FFB800','#FF8A00','#00B3D6'].includes(c),splash=i%3===2;
      h+='<div class="stop done'+side+(splash?' splash':'')+nw+'" id="s'+i+'" style="--r:'+r+';--c:'+c+'"><span class="sign">'+(i+1)+'</span><div class="strip">'+
        '<button class="art" data-i="'+i+'"><img src="'+IM(i)+'" alt=""><span class="cap">'+T(i)+'</span>'+(splash?'<span class="bubble">'+first(STEP(i))+'</span>':'')+(i===U-1?BOOM(WORDS[i%5]):'')+'</button>'+
        (splash?'':'<div class="txt'+(light?' light':'')+'"><span>'+STEP(i)+'</span></div>')+'</div></div>'}
    else if(i===U)h+='<div class="stop next'+side+'" id="s'+i+'" style="--r:'+r+'"><span class="sign">'+(i+1)+'</span><div class="strip"><button class="nextin" data-i="'+i+'"><div><div class="h">?</div><small>PRÜFUNG · DANN GEHT ES WEITER</small></div></button></div></div>';
    else h+='<div class="stop lock'+side+'" id="s'+i+'" style="--r:'+r+'"><span class="sign">'+(i+1)+'</span><div class="strip"><div class="art"></div><div class="txt"></div></div></div>'}
  h+='<div class="tbc">Fortsetzung folgt<span>…</span></div>';
  $('#page').innerHTML=h;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>sheet(+b.dataset.i));
  drawRoad();
}
/* Straße: von Schild zu Schild, durch die Lücken zwischen den Panels */
function drawRoad(){
  const page=$('#page'),pr=page.getBoundingClientRect(),road=$('#road');page.querySelectorAll('.klecks').forEach(k=>k.remove());page.classList.add('measure');
  const pt=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2-pr.left,r.top+r.height/2-pr.top]};
  /* Ausgang unten am Panel (auf der Seite des nächsten Schilds), Eingang am Schild oben */
  const stops=[$('#s-1'),...document.querySelectorAll('.stop')],signs=[...document.querySelectorAll('.stop .sign')].map(pt),segs=[];
  for(let k=0;k<signs.length;k++){const r=stops[k].getBoundingClientRect(),x=k?signs[k-1][0]:r.left-pr.left+r.width*.75;
    segs.push([[x,r.bottom-pr.top-6],signs[k]])}
  page.classList.remove('measure');
  road.setAttribute('height',page.scrollHeight);road.setAttribute('width',pr.width);
  let s='';const seg=(a,b)=>{const my=(a[1]+b[1])/2;return 'M'+a[0]+' '+a[1]+'C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]};
  for(let k=0;k<segs.length;k++){const [a,b]=segs[k],i=k,d=seg(a,b);
    if(i<U){ // gegangen: schwarze Straße mit weißer Mittellinie
      s+='<g class="seg" id="seg'+i+'"><path class="blk" d="'+d+'" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/><path class="mid" d="'+d+'" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round"/></g>'}
    else if(i===U){ // aktuelles Stück: Straße im Bau, mit Siegen als Rauten
      s+='<path d="'+d+'" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round" opacity=".18"/><path id="cur" d="'+d+'" fill="none" stroke="#FF2E88" stroke-width="6" stroke-dasharray="1 12" stroke-linecap="round"/>'}
    else s+='<path d="'+d+'" fill="none" stroke="#000" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".45"/>'}
  road.innerHTML=s;
  const cur=$('#cur');
  if(cur){const L=cur.getTotalLength(),n=NEED[Math.min(U-1,NEED.length-1)];let g='';
    for(let j=0;j<n;j++){const p=cur.getPointAtLength(L*(j+1)/(n+1));
      g+='<g transform="translate('+p.x+' '+p.y+') rotate(45)"><rect class="dia'+(j===WINS?' now':'')+'" x="-9" y="-9" width="18" height="18" fill="'+(j<WINS?'#FF2E88':'#fff')+'" stroke="#000" stroke-width="3" style="animation-delay:'+(.4+j*.12)+'s"/></g>'}
    road.insertAdjacentHTML('beforeend',g);
    const kp=cur.getPointAtLength(L*(WINS+.5)/(n+1)),k=document.createElement('div');
    k.className='klecks';k.style.left=(kp.x+(kp.x<pr.width/2?40:-40))+'px';k.style.top=(kp.y-8)+'px';k.innerHTML=KL+'<span class="say"></span>';page.append(k);
    k.onclick=()=>{k.classList.remove('squish');k.offsetWidth;k.classList.add('squish');const sy=k.querySelector('.say');sy.textContent=SAYS[(sayI++)%SAYS.length];sy.classList.add('on');clearTimeout(k._t);k._t=setTimeout(()=>sy.classList.remove('on'),1600)};
    if(hopFrom){const pts=[];for(let q=0;q<=12;q++){const t=q/12,pp=cur.getPointAtLength(L*(WINS+.5)/(n+1)*t);pts.push({left:(pp.x+(pp.x<pr.width/2?40:-40))+'px',top:(pp.y-8-Math.abs(Math.sin(t*Math.PI*3))*28)+'px'})}
      k.animate(pts,{duration:1100,easing:'ease-in-out',delay:500})}}
  observe();
}
let io=null;
function observe(){
  document.body.classList.add('mo');if(io)io.disconnect();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){document.querySelectorAll('.stop').forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;io.unobserve(el);
    const i=+el.id.slice(1),seg=document.getElementById('seg'+i);
    if(seg&&!seg.dataset.drawn){seg.dataset.drawn=1;const b=seg.querySelector('.blk'),m=seg.querySelector('.mid'),L=b.getTotalLength();
      b.animate([{strokeDasharray:L,strokeDashoffset:L},{strokeDasharray:L,strokeDashoffset:0}],{duration:520,easing:'cubic-bezier(.5,0,.3,1)'});
      m.animate([{opacity:0},{opacity:0,offset:.7},{opacity:1}],{duration:800})}
    setTimeout(()=>{el.classList.add('in');if(el.querySelector('.boom'))splat(el)},seg?380:0)}),{rootMargin:'0px 0px -12% 0px',threshold:.15});
  document.querySelectorAll('.stop').forEach(e=>{if(e.classList.contains('in')){const g=document.getElementById('seg'+e.id.slice(1));if(g)g.dataset.drawn=1}else io.observe(e)});
}
/* kleine Tuschespritzer beim neuesten Panel */
function splat(el){const r=el.getBoundingClientRect(),pr=$('#page').getBoundingClientRect();
  for(let k=0;k<12;k++){const d=document.createElement('i');d.className='ink';const a=Math.random()*6.28,dist=50+Math.random()*90,sz=4+Math.random()*10;
    d.style.width=d.style.height=sz+'px';d.style.left=(r.left-pr.left+70)+'px';d.style.top=(r.bottom-pr.top-50)+'px';$('#page').append(d);
    d.animate([{transform:'translate(0,0) scale(0)'},{transform:'translate('+Math.cos(a)*dist+'px,'+Math.sin(a)*dist+'px) scale(1)',offset:.6},{transform:'translate('+Math.cos(a)*dist+'px,'+(Math.sin(a)*dist+20)+'px) scale(.6)',opacity:0}],{duration:900,delay:900,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'}).onfinish=()=>d.remove()}}
function centerOn(i,smooth){const el=$('#s'+i);if(el)scrollTo({top:el.offsetTop-innerHeight*.45,behavior:smooth?'smooth':'auto'})}
window.onProgress=d=>{render(d>0);centerOn(U,true)};
addEventListener('resize',()=>drawRoad());
chrome(4);render();
document.fonts&&document.fonts.ready.then(()=>{drawRoad();centerOn(U)});
centerOn(U);
</script>
</body>
</html>
