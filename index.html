<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEECE7">
<title>memo punch</title>
<meta name="description" content="Memory mit Tuschezeichnungen. Finde Paare, sammle Bilder, folge der Geschichte.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="memo punch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2) format('woff2');font-weight:600;font-display:swap}
/* ============ Gestaltung: Rams rund ============
   Warmes Grau, Orange als einziger Akzent, runde Bilder, ruhige Bewegung. */
:root{
  --bg:#EEECE7;--panel:#E4E1DA;--card:#fff;--ink:#1F1F1D;--mute:#8C8980;--soft:#55524B;--line:#D6D2C9;--line2:#EFECE6;--dot:#CFCBC1;
  --acc:#E8572A;--dark:#262624;
  --r:999px;--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.2,1.25,.4,1);--out:cubic-bezier(.2,.8,.2,1);
  --top:calc(env(safe-area-inset-top) + 14px);--tabh:66px;--bot:env(safe-area-inset-bottom)}
html.big{font-size:112.5%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,'Helvetica Neue',Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
.app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;user-select:none;-webkit-user-select:none}
.cap{font-size:.656rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---------- Ansichten ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:var(--top) 20px calc(var(--tabh) + var(--bot) + 18px);
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s var(--ease),transform .45s var(--out),visibility 0s .35s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s var(--ease),transform .45s var(--out),visibility 0s}
.view.full{padding-bottom:calc(var(--bot) + 16px)}
.scroll{overflow-y:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 8px;flex:1;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;flex:none}
.logo{font-weight:600;font-size:1.375rem;letter-spacing:-.02em;white-space:nowrap}
.logo span{font-weight:400;color:var(--mute);margin-left:4px}
.logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-left:7px;vertical-align:2px;transition:transform .5s var(--spring)}
.logo:active i{transform:scale(1.8)}
.chip{font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);background:var(--card);border-radius:var(--r);padding:8px 14px;box-shadow:0 1px 0 var(--line);white-space:nowrap}
.chip.acc{color:var(--acc)}
.h1{font-weight:600;font-size:1.75rem;letter-spacing:-.03em;line-height:1.1}

/* Tasten */
.key{position:relative;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 #E2DED6,0 1px 2px rgba(0,0,0,.12);transition:transform .15s var(--ease),box-shadow .15s var(--ease),opacity .3s}
.key:active{transform:translateY(1px) scale(.96);box-shadow:inset 0 -1px 0 #E2DED6,0 0 1px rgba(0,0,0,.12)}
.key .badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:.6875rem;font-weight:600;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg);transition:transform .4s var(--spring)}
.key.empty{opacity:.45}.key.empty .badge{background:var(--dot);color:var(--ink)}
.key.nope{animation:nope .4s var(--ease)}
.key.got .badge{animation:got .6s var(--spring)}
@keyframes got{40%{transform:scale(1.6)}}
@keyframes nope{25%{translate:-4px 0}75%{translate:4px 0}}
.play{flex:1;min-width:0;height:68px;border-radius:var(--r);background:var(--dark);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px 0 26px;font-size:1rem;font-weight:600;transition:transform .15s var(--ease)}
.play span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play:active{transform:scale(.98)}
.play .go{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;transition:transform .35s var(--spring)}
.play:active .go{transform:translateX(4px)}
.play .ico{stroke-width:2.2}
.mini{width:68px;height:68px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;font-size:.594rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.mini .dotb{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);transform:scale(0);transition:transform .4s var(--spring)}
.mini.due .dotb{transform:scale(1)}
.btn{height:56px;border-radius:var(--r);padding:0 24px;font-weight:600;font-size:.9375rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.o{background:var(--acc);color:#fff}
.btn.d{background:var(--dark);color:var(--bg)}
.btn.g{background:var(--bg);color:var(--ink)}
.btn.w{flex:1;min-width:0}
.row{display:flex;gap:12px;align-items:center}

/* Tab-Leiste */
.tabs{position:absolute;z-index:20;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--bot));padding:0 12px var(--bot);display:flex;background:var(--bg);border-top:1px solid var(--line);transition:transform .45s var(--out)}
.tabs.off{transform:translateY(110%)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.594rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:color .25s}
.tabs button[aria-current]{color:var(--ink)}
.tabs .ind{position:absolute;top:7px;left:0;width:5px;height:5px;border-radius:50%;background:var(--acc);transition:transform .5s var(--spring)}

/* ---------- Start: Weg ---------- */
.map{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;margin:0 -20px;scrollbar-width:none;
  background:radial-gradient(circle,#D7D3CA 1.1px,transparent 1.4px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.map::-webkit-scrollbar{display:none}
.mapin{position:relative}
.mapin svg{position:absolute;left:0;top:0;overflow:visible}
.p-done{fill:none;stroke:var(--ink);stroke-width:1.5}
.p-next{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round;animation:march 1.4s linear infinite}
.p-fut{fill:none;stroke:#B2AEA4;stroke-width:2;stroke-dasharray:1 6;stroke-linecap:round}
@keyframes march{to{stroke-dashoffset:-7}}
.rd{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.rd.on{fill:var(--ink)}
.rd.cur{stroke:var(--acc)}.rd.cur.on{fill:var(--acc)}
.rd.fut{stroke:#B2AEA4}
/* Meisterrunden: dunkler Ringpunkt, leichte Schattierung, ernsterer Grund */
.rd.m{stroke:var(--ink);stroke-width:2;fill:var(--bg)}
.mo{fill:none;stroke:var(--ink);stroke-width:1;opacity:.55}.mo.fut{stroke:#9E9A90;opacity:.5}
.rd.m.on{fill:var(--ink)}
.rd.m.fut{stroke:#9E9A90}
.rd.mi{fill:var(--acc);stroke:none}
.mring{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center;animation:mring 2.8s ease-out infinite}
@keyframes mring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.shade{position:absolute;width:260px;height:260px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(31,31,29,.07),rgba(31,31,29,.03) 45%,transparent 70%);transition:opacity .8s}
.shade::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#BDB8AE 1.2px,transparent 1.5px) 0 0/11px 11px;
  -webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%);opacity:.8}
.shade.cur{background:radial-gradient(circle,rgba(31,31,29,.11),rgba(31,31,29,.05) 45%,transparent 70%)}
.mlbl{position:absolute;font-size:.594rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);white-space:nowrap;pointer-events:none}
.mlbl.cur{color:var(--ink)}
html,body,.app,.tabs{transition:background-color 1.2s var(--ease)}
.serious{--bg:#E6E3DC;--panel:#DAD6CD;--line:#CCC7BC}
.serious body,html.serious{background:#E6E3DC}
.serious .map{background-image:radial-gradient(circle,#C9C4BA 1.2px,transparent 1.5px)}
.serious .play{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.gate .bwrap{box-shadow:inset 0 0 0 1.5px rgba(31,31,29,.12)}
.glint{fill:var(--acc);filter:drop-shadow(0 0 4px rgba(232,87,42,.6))}
.st{position:absolute;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;background:var(--card);padding:4px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07)}
.st img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.st .lbl{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--card);border-radius:var(--r);padding:5px 11px 5px 9px;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 1px 0 var(--line);display:flex;gap:7px}
.st .lbl b{font-weight:600;color:var(--mute);transition:color .6s}
.st.next{width:66px;height:66px;padding:0;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:1.625rem;animation:ring 2.6s ease-out infinite}
.st.next .lbl{color:var(--acc)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(232,87,42,.35)}100%{box-shadow:0 0 0 20px rgba(232,87,42,0)}}
.st.lock{width:16px;height:16px;padding:0;background:var(--dot);box-shadow:none;pointer-events:none}
.st.lock .n{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);font-size:.6875rem;font-weight:600;color:var(--mute)}
.st.in{animation:stIn .6s var(--out) backwards}
@keyframes stIn{from{opacity:0;transform:translate(-50%,-30%) scale(.9)}}
.st.fresh{animation:fresh 1.2s var(--spring) backwards}
@keyframes fresh{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}60%{opacity:1}}
.mapin .st:not(.lock){transition:transform .6s var(--spring),opacity .6s var(--ease),box-shadow .6s var(--ease)}
.st:not(.lock):active{transform:translate(-50%,-50%) scale(.95)}
.st.focus{transform:translate(-50%,-50%) scale(1.07);box-shadow:0 2px 2px rgba(0,0,0,.06),0 16px 32px rgba(0,0,0,.12)}
.st.focus .lbl b{color:var(--acc)}
.hasf .st:not(.focus):not(.next):not(.lock){opacity:.72}
.act{position:absolute;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;max-width:120px;line-height:1.3}
.act.l{left:20px}.act.r{right:20px;text-align:right}
.act b{font-weight:600;color:var(--ink);letter-spacing:.08em}
.snip{position:absolute;max-width:124px;font-size:.72rem;line-height:1.4;color:var(--mute);font-style:italic;opacity:.25;transition:opacity .8s var(--ease),transform .8s var(--out)}
.snip.l{left:20px;transform:translate(-8px,-50%)}.snip.r{right:20px;text-align:right;transform:translate(8px,-50%)}
.snip.vis{opacity:1;transform:translate(0,-50%)}
.snip::before{content:'';display:block;width:14px;height:1px;background:var(--acc);margin-bottom:6px;transform:scaleX(0);transform-origin:left;transition:transform .8s .2s var(--out)}
.snip.r::before{margin-left:auto;transform-origin:right}
.snip.vis::before{transform:none}
.ghost{position:absolute;opacity:.09;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--rr));will-change:translate}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8125rem;color:var(--soft);border-top:1px solid var(--line);padding-top:12px;flex:none}
.pips{display:flex;gap:5px;flex:none}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--dot);transition:background .4s,transform .5s var(--spring)}
.pips i.on{background:var(--acc)}
.pips i.pop{transform:scale(1.7)}
.pips i.m{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink)}
.serious .pips i.m{background:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.playrow{display:flex;gap:14px;align-items:center;flex:none}
.zoom{position:fixed;z-index:30;border-radius:50%;background:var(--acc);pointer-events:none}

/* ---------- Spiel ---------- */
.ghd{display:flex;align-items:center;gap:10px;flex:none}
.ghd .t{flex:1;min-width:0}
.ghd .t b{display:block;font-weight:600;font-size:1.25rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .v{font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.stat .v.tick{animation:tick .35s var(--spring)}
@keyframes tick{40%{transform:translateY(-3px)}}
.sub{display:flex;align-items:center;gap:12px;min-height:18px;flex:none}
.msg{flex:1;font-size:.8125rem;color:var(--mute);transition:opacity .25s}
.msg.swap{opacity:0}
.msg.acc{color:var(--acc)}
.lives{display:flex;gap:5px;align-items:center}
.lives i{width:8px;height:8px;border-radius:50%;background:var(--ink);transition:background .4s,transform .4s var(--spring)}
.lives i.off{background:var(--dot);transform:scale(.7)}
.peek{height:2px;background:var(--line);border-radius:1px;overflow:hidden;flex:none}
.peek i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0)}
.bwrap{flex:1;min-height:0;background:var(--panel);border-radius:26px;display:grid;place-items:center;padding:14px}
.board{display:grid;gap:12px}
.card{position:relative;aspect-ratio:1;perspective:800px;padding:0;transition:transform .5s var(--out)}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.f.back{background:#F7F6F2 radial-gradient(circle,#BDB9AF 2px,transparent 2.4px) 50% 50%/10px 10px;box-shadow:inset 0 0 0 1px var(--line),inset 0 -4px 0 rgba(0,0,0,.04)}
.f.front{transform:rotateY(180deg);background:var(--card);padding:4px;box-shadow:inset 0 0 0 0 var(--acc);transition:box-shadow .45s var(--ease)}
.f.front img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.card.done .f.front{box-shadow:inset 0 0 0 3px var(--acc)}
.card.deal{animation:deal .5s var(--out) backwards}
@keyframes deal{from{opacity:0;transform:scale(.6)}}
.card.nope .in{animation:cnope .4s var(--ease)}
@keyframes cnope{0%,100%{transform:rotateY(180deg)}30%{transform:rotateY(180deg) translateX(4px)}60%{transform:rotateY(180deg) translateX(-4px)}}

/* ---------- Blätter ---------- */
.sheet{position:absolute;inset:0;z-index:40;overflow:hidden;display:flex;align-items:flex-end;background:rgba(238,236,231,0);visibility:hidden;transition:background .35s,visibility 0s .5s}
.sheet.on{background:rgba(238,236,231,.82);visibility:visible;transition:background .35s,visibility 0s}
.sheet .pane{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:12px 22px calc(var(--bot) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.08);transform:translateY(105%);transition:transform .5s var(--out);max-height:94%;overflow-y:auto;scrollbar-width:none}
.sheet.on .pane{transform:none}
.sheet.center{align-items:center;padding:20px}
.sheet.center .pane{border-radius:28px;transform:scale(.92);opacity:0;transition:transform .45s var(--spring),opacity .3s}
.sheet.center.on .pane{transform:none;opacity:1}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.ptitle{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.ptext{font-size:.9375rem;line-height:1.55;color:var(--soft);margin-bottom:20px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kv div{border-top:1px solid var(--ink);padding-top:8px;min-width:0}
.kv .v{font-size:1.625rem;letter-spacing:-.02em;margin-top:2px}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.prog .pips i{width:10px;height:10px}
.prog .thumb{width:44px;height:44px;border-radius:50%;background:#F7F6F2 radial-gradient(circle,#BDB9AF 1.6px,transparent 2px) 50% 50%/8px 8px;flex:none}
.sdots{display:flex;gap:8px;align-items:center}
.sdots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--dot);transition:background .3s,box-shadow .3s,transform .5s var(--spring)}
.sdots i.on{background:var(--acc);box-shadow:none;transform:scale(1.15)}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.recb{display:inline-block;margin-top:8px;font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.unlock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.uimg{position:relative;width:200px;height:200px;margin:4px 0 10px;flex:none}
.uimg img{position:absolute;inset:12px;width:176px;height:176px;border-radius:50%;object-fit:cover;transform:scale(.2);opacity:0}
.uimg svg{position:absolute;inset:0;width:200px;height:200px;transform:rotate(-90deg)}
.uimg circle{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-dasharray:597;stroke-dashoffset:597}
.uimg .spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--acc);opacity:0}
.unlock.go .uimg img{animation:uimg 1s .2s var(--spring) forwards}
.unlock.go .uimg circle{animation:udraw 1.1s .5s var(--ease) forwards}
@keyframes uimg{to{transform:none;opacity:1}}
@keyframes udraw{to{stroke-dashoffset:0}}
.unlock h2{font-weight:600;font-size:1.875rem;letter-spacing:-.03em;line-height:1.1}
.unlock p{font-size:.9375rem;line-height:1.55;color:var(--soft);max-width:330px}
.fade{opacity:0;transform:translateY(8px)}
.go .fade{animation:fade .6s var(--out) forwards}
@keyframes fade{to{opacity:1;transform:none}}
.stagebox{background:var(--bg);border-radius:18px;padding:16px;margin:16px 0 18px;display:flex;gap:14px;align-items:center}
.stagebox .ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;color:var(--acc);font-weight:600;flex:none}
.stagebox b{display:block;font-weight:600;margin-bottom:2px}
.stagebox span{font-size:.875rem;color:var(--soft);line-height:1.45}

/* ---------- Sammlung ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;padding:6px 0 10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0}
.cell .c{width:100%;aspect-ratio:1;border-radius:50%;background:var(--card);padding:4px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07);transition:transform .35s var(--spring)}
.cell .c img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.cell:active .c{transform:scale(.95)}
.cell .l{font-size:.656rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.3}
.cell .l b{color:var(--mute);font-weight:600;margin-right:4px}
.cell.lock .c{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--mute);font-size:.8125rem;font-weight:600}
.cell.lock .l{color:var(--mute)}
.cell.in{animation:fade .5s var(--out) backwards}
.cell.in{opacity:0;transform:translateY(8px);animation:fade .5s var(--out) forwards}
#det .pane{height:min(90%,780px);max-height:none;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(var(--bot) + 16px)}
.dscroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 18px;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.dscroll::-webkit-scrollbar{display:none}
.detail{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.dnav{display:flex;align-items:center;gap:18px;margin:6px 0 8px}
.detail .big{width:min(220px,56vw);aspect-ratio:1;border-radius:50%;padding:6px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.08)}
.detail .big img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.detail h2{font-weight:600;font-size:1.75rem;letter-spacing:-.03em;line-height:1.1}
.detail .txt{font-size:.9375rem;line-height:1.6;color:var(--soft);text-align:left;width:100%;max-width:380px}
.detail .txt p+p{margin-top:12px}
.detail .q{border-left:2px solid var(--acc);padding-left:14px;color:var(--ink)}
.meta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.fly{position:fixed;z-index:45;border-radius:50%;overflow:hidden;pointer-events:none}
.fly img{width:100%;height:100%;object-fit:cover}

/* ---------- Statistik ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .stat .v{font-size:2.125rem}
.box{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 0 var(--line)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:14px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--dot);transform-origin:bottom;transform:scaleY(0);transition:transform .7s var(--out)}
.bars i.best{background:var(--acc)}
.box.on .bars i{transform:scaleY(1)}
.axis{display:flex;justify-content:space-between;margin-top:8px}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:.875rem}
.tbl div+div{border-top:1px solid var(--line2)}
.tbl em{font-style:normal;color:var(--soft);font-variant-numeric:tabular-nums}

/* ---------- Optionen ---------- */
.list{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line)}
.li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;width:100%;text-align:left;font-size:.9375rem;min-height:56px}
.li+.li{border-top:1px solid var(--line2)}
.li small{display:block;font-size:.75rem;color:var(--mute);margin-top:2px}
.sw{position:relative;width:50px;height:30px;border-radius:var(--r);background:var(--dot);flex:none;transition:background .3s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .45s var(--spring)}
[aria-checked=true] .sw{background:var(--acc)}
[aria-checked=true] .sw::after{transform:translateX(20px)}
.segc{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:var(--r);padding:3px;flex:none;width:170px}
.segc button{position:relative;z-index:1;height:34px;font-size:.8125rem;font-weight:600;color:var(--mute);transition:color .3s}
.segc button[aria-checked=true]{color:var(--ink)}
.segc .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:var(--r);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .45s var(--spring)}
.segc.r .knob{transform:translateX(100%)}
.foot{text-align:center;font-size:.75rem;color:var(--mute);line-height:1.6;padding:6px 0 4px}

/* ---------- Projekt ---------- */
#about .pane{height:min(92%,800px);max-height:none;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(var(--bot) + 16px)}
.av{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:1rem;letter-spacing:.04em;color:var(--ink);flex:none;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.av.a{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc)}
.duo{display:flex;align-items:center}
.duo .av+.x{margin:0 -6px;z-index:1;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--acc);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.credit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 1px 0 var(--line);margin:4px 0 10px;transition:transform .2s var(--ease)}
.credit:active{transform:scale(.98)}
.credit .av{width:40px;height:40px;font-size:.75rem}
.credit b{display:block;font-weight:600;font-size:.9375rem}
.credit small{display:block;font-size:.75rem;color:var(--mute);margin-top:2px}
.credit .ico{margin-left:auto;color:var(--mute)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.steps div{display:flex;gap:14px;align-items:flex-start;font-size:.9375rem;line-height:1.5;color:var(--soft)}
.steps div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8125rem;font-weight:600;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.person{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:start}
.person .av{margin-top:4px}
.names{font-weight:600;font-size:1.75rem;letter-spacing:-.03em;line-height:1.15;margin:4px 0 14px}
.names span{color:var(--acc);font-weight:400;margin:0 6px}
.person{border-top:1px solid var(--line);padding:18px 0}
.person h3{font-weight:600;font-size:1.125rem;margin:4px 0 6px}
.person p{font-size:.9375rem;line-height:1.55;color:var(--soft)}
.person a{display:inline-flex;margin-top:10px;color:var(--acc);font-weight:600;text-decoration:none;font-size:.875rem}
.strip{display:flex;gap:-8px;margin:6px 0 16px;flex-wrap:wrap}
.strip img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-right:-10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.copy{font-size:.8125rem;color:var(--mute);line-height:1.55;margin:6px 0 18px}

/* ---------- Mini-Spiele ---------- */
.mstat{display:flex;gap:14px;align-items:center;justify-content:center;min-height:22px;font-size:.8125rem;color:var(--soft);flex:none}
.mstat img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.minfo{font-size:.9375rem;line-height:1.55;color:var(--soft);text-align:center;max-width:340px;margin:0 auto}
.mstage{flex:1;min-height:0;background:var(--panel);border-radius:26px;display:grid;place-items:center;padding:18px;position:relative;overflow:hidden}
.sgrid{display:grid;gap:16px;width:100%}
.sgrid button{aspect-ratio:1;border-radius:50%;background:var(--card);padding:4px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07);transition:transform .25s var(--spring),box-shadow .25s,opacity .3s}
.sgrid button img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none}
.sgrid.dim button{opacity:.55}
.sgrid button.lit{opacity:1;transform:scale(1.07);box-shadow:0 0 0 4px var(--acc),0 10px 24px rgba(232,87,42,.25)}
.sgrid button.bad{box-shadow:0 0 0 4px var(--ink)}
.flash{width:min(64vw,250px);aspect-ratio:1;border-radius:50%;object-fit:cover;background:#fff;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.08);animation:flin .35s var(--spring)}
@keyframes flin{from{transform:scale(.85);opacity:.3}}
.flash.ok{box-shadow:0 0 0 5px var(--acc)}
.flash.ko{box-shadow:0 0 0 5px var(--ink)}
.blank{width:min(64vw,250px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--mute);font-size:2.5rem;font-weight:600}
.mres{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mres b{font-size:3.5rem;font-weight:600;letter-spacing:-.04em;line-height:1}
.mres span{font-size:.875rem;color:var(--soft)}
.mres .rec{color:var(--acc);font-weight:600}
.mbtns{display:flex;gap:12px;flex:none}

/* ---------- Prolog ---------- */
.intro{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--top) + 10px) 26px calc(var(--bot) + 24px);transition:opacity .5s,transform .6s var(--out)}
.intro.out{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden;transition:opacity .5s,transform .6s var(--out),visibility 0s .6s}
.intro .skip{align-self:flex-end;font-size:.8125rem;color:var(--mute);font-weight:600;padding:8px 0}
.slides{flex:1;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:20px;opacity:0;transform:translateX(30px);transition:opacity .5s var(--ease),transform .6s var(--out);visibility:hidden}
.slide.on{opacity:1;transform:none;visibility:visible}
.slide.past{transform:translateX(-30px)}
.slide h1{font-weight:600;font-size:2.125rem;letter-spacing:-.035em;line-height:1.1}
.slide p{font-size:1.0625rem;line-height:1.6;color:var(--soft)}
.drop{width:120px;height:120px;position:relative}
.drop i{position:absolute;left:50%;top:0;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--acc);animation:drip 2.4s var(--ease) infinite}
.drop b{position:absolute;left:50%;bottom:6px;width:90px;height:2px;margin-left:-45px;background:var(--ink)}
@keyframes drip{0%{transform:translateY(-10px) scale(.6,.8);opacity:0}20%{opacity:1}55%{transform:translateY(80px) scale(1)}62%{transform:translateY(86px) scale(1.5,.5)}100%{transform:translateY(86px) scale(1.6,.4);opacity:0}}
.pulse{width:56px;height:56px;border-radius:50%;background:var(--acc);animation:ring 2.6s ease-out infinite;margin:20px 0 10px 30px}
.circles{display:flex}
.circles img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin-right:-16px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.slide.on .circles img{animation:fade .6s var(--out) backwards}
.knobs{display:flex;gap:10px}
.knobs i{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:inset 0 -3px 0 #E2DED6,0 1px 2px rgba(0,0,0,.12)}
.knobs i:nth-child(2){background:var(--acc)}
.ifoot{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--dot);transition:width .4s var(--spring),background .3s}
.dots i.on{width:22px;background:var(--ink)}
.slide .segc{width:100%;max-width:320px}
.slide .segc button{height:46px;font-size:.9375rem}

/* ---------- Hinweis ---------- */
.toast{position:absolute;z-index:70;left:16px;right:16px;bottom:calc(var(--tabh) + var(--bot) + 14px);background:var(--dark);color:var(--bg);border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.875rem;transform:translateY(160%);visibility:hidden;pointer-events:none;transition:transform .5s var(--out),visibility 0s .5s}
.toast.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .5s var(--out)}
.toast button{background:var(--acc);color:#fff;border-radius:var(--r);padding:10px 16px;font-weight:600;font-size:.8125rem}

.calm *,.calm *::before,.calm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- START -->
  <section class="view on" id="v-home">
    <header class="hd"><button class="logo" id="logo"><span data-t="logoA" style="color:var(--ink);font-weight:600;margin:0"></span><span data-t="logoB"></span><i></i></button><span class="chip num" id="roundChip"></span></header>
    <div class="map" id="map" role="region" data-ta="mapAria"><div class="mapin" id="mapIn"></div></div>
    <div class="status"><span id="stTxt"></span><span class="pips" id="pips"></span></div>
    <div class="playrow">
      <button class="play" id="play"><span id="playTxt"></span><span class="go" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      <button class="key mini" id="miniBtn" data-ta="miniAria"><span class="dotb"></span><svg class="ico" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></svg><span data-t="mini"></span></button>
    </div>
  </section>

  <!-- SAMMLUNG -->
  <section class="view" id="v-col">
    <header class="hd"><h1 class="h1" data-t="colTitle"></h1><span class="chip num" id="colChip"></span></header>
    <div class="scroll"><div id="credit"></div><div class="grid" id="grid"></div></div>
  </section>

  <!-- STATISTIK -->
  <section class="view" id="v-stats">
    <header class="hd"><h1 class="h1" data-t="statsTitle"></h1><span class="chip acc num" id="starChip"></span></header>
    <div class="scroll" style="display:flex;flex-direction:column;gap:12px">
      <div class="two">
        <div class="stat"><span class="cap" data-t="kWon"></span><span class="v num" id="sWon">0</span></div>
        <div class="stat"><span class="cap" data-t="kPairs"></span><span class="v num" id="sPairs">0</span></div>
        <div class="stat"><span class="cap" data-t="kAcc"></span><span class="v num" id="sAcc">–</span></div>
        <div class="stat"><span class="cap" data-t="kStreak"></span><span class="v num" id="sStreak">0</span></div>
      </div>
      <div class="box" id="chart"><div class="row" style="justify-content:space-between"><span class="cap" data-t="chart"></span><span class="cap" style="color:var(--acc)">● <span data-t="chartBest"></span></span></div><div class="bars" id="bars"></div><div class="axis cap"><span data-t="earlier"></span><span data-t="latest"></span></div></div>
      <div class="box"><span class="cap" data-t="bestTimes"></span><div class="tbl" id="bests" style="margin-top:6px"></div></div>
      <div class="box"><span class="cap" data-t="minisTitle"></span><div class="tbl" id="minis" style="margin-top:6px"></div></div>
    </div>
  </section>

  <!-- OPTIONEN -->
  <section class="view" id="v-set">
    <header class="hd"><h1 class="h1" data-t="setTitle"></h1></header>
    <div class="scroll" style="display:flex;flex-direction:column;gap:14px">
      <div class="list">
        <div class="li"><span><span data-t="difficulty"></span><small id="modeNote"></small></span>
          <div class="segc" id="mode" role="radiogroup" data-ta="difficulty"><span class="knob"></span><button role="radio" data-m="easy" data-t="beginner"></button><button role="radio" data-m="pro" data-t="pro"></button></div></div>
        <div class="li"><span data-t="language"></span>
          <div class="segc" id="lang" role="radiogroup" data-ta="language"><span class="knob"></span><button role="radio" data-l="de" lang="de">Deutsch</button><button role="radio" data-l="en" lang="en">English</button></div></div>
      </div>
      <div class="list">
        <button class="li" role="switch" data-k="sound"><span><span data-t="sound"></span><small data-t="soundSub"></small></span><span class="sw"></span></button>
        <button class="li" role="switch" data-k="loud" id="loudRow"><span><span data-t="loud"></span><small data-t="loudSub"></small></span><span class="sw"></span></button>
        <button class="li" role="switch" data-k="haptic" id="hapRow"><span><span data-t="haptic"></span><small id="hapSub"></small></span><span class="sw"></span></button>
        <button class="li" role="switch" data-k="calm"><span><span data-t="calm"></span><small data-t="calmSub"></small></span><span class="sw"></span></button>
        <button class="li" role="switch" data-k="big"><span><span data-t="big"></span><small data-t="bigSub"></small></span><span class="sw"></span></button>
      </div>
      <div class="list">
        <button class="li" id="installRow"><span><span data-t="install"></span><small data-t="installSub"></small></span><svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
        <button class="li" id="introRow"><span data-t="prologue"></span><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="li" id="aboutRow"><span data-t="about"></span><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="list">
        <button class="li" id="resetRow"><span><span data-t="reset"></span><small data-t="resetSub"></small></span><svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <button class="li" id="devRow" hidden><span data-t="devUnlock"></span><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
      </div>
      <p class="foot" id="foot"></p>
    </div>
  </section>

  <!-- SPIEL -->
  <section class="view full" id="v-game">
    <header class="ghd">
      <button class="key" id="gBack" data-ta="back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t"><span class="cap" id="gCap"></span><b id="gTitle"></b></div>
      <button class="key" id="joker"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="badge num" id="jokerN">1</span></button>
      <button class="key" id="gPause" data-ta="pause"><svg class="ico" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    </header>
    <div class="hud">
      <div class="stat"><span class="cap" data-t="hudPairs"></span><span class="v num" id="hP">0</span></div>
      <div class="stat"><span class="cap" data-t="hudMoves"></span><span class="v num" id="hM">0</span></div>
      <div class="stat"><span class="cap" data-t="hudTime"></span><span class="v num" id="hT">0:00</span></div>
    </div>
    <div class="peek" aria-hidden="true"><i id="peekBar"></i></div>
    <div class="sub"><span class="msg" id="msg" role="status" aria-live="polite"></span><span class="lives" id="lives" data-ta="lives"></span></div>
    <div class="bwrap" id="bwrap"><div class="board" id="board"></div></div>
  </section>

  <!-- MINI -->
  <section class="view full" id="v-mini">
    <header class="ghd">
      <button class="key" id="mBack" data-ta="back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t"><span class="cap" id="mTag"></span><b id="mTitle"></b></div>
    </header>
    <div class="mstat" id="mStat"></div>
    <div class="mstage" id="mStage"></div>
    <div class="mbtns"><button class="btn g w" id="mSkip"></button><button class="btn o w" id="mBtn"></button></div>
  </section>

  <nav class="tabs" id="tabs">
    <span class="ind" id="ind"></span>
    <button data-v="home"><svg class="ico" viewBox="0 0 24 24"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="7" r="3"/><path d="M9.5 15.5l5-7"/></svg><span data-t="tabPlay"></span></button>
    <button data-v="col"><svg class="ico" viewBox="0 0 24 24"><circle cx="7.5" cy="7.5" r="3.5"/><circle cx="16.5" cy="7.5" r="3.5"/><circle cx="7.5" cy="16.5" r="3.5"/><circle cx="16.5" cy="16.5" r="3.5"/></svg><span data-t="tabCol"></span></button>
    <button data-v="stats"><svg class="ico" viewBox="0 0 24 24"><path d="M6 19V13M12 19V6M18 19v-9"/></svg><span data-t="tabStats"></span></button>
    <button data-v="set"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span data-t="tabSet"></span></button>
  </nav>

<script>

/* ===================== Grunddaten ===================== */

const STAGE_RULES=[{peek:1300,rot:1},{peek:1100,rot:1,swap:1},{peek:900,rot:1,swap:1,lives:3},{peek:0,rot:1,swap:1,lives:5}];

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const two=n=>String(n).padStart(2,'0'),mmss=s=>Math.floor(s/60)+':'+two(s%60);

/* ===================== Spielstand (kompatibel mit der bisherigen App) ===================== */
const KEY='memo-punch-v1';
const defLang=(navigator.language||'de').toLowerCase().startsWith('de')?'de':'en';
const FRESH=()=>({round:1,unlocked:2,prog:0,master:0,
  stats:{won:0,lost:0,pairs:0,moves:0,streak:0,bestStreak:0,time:0,stars:0},
  best:{},found:Array(ALL).fill(0),at:[1,1].concat(Array(Math.max(0,ALL-2)).fill(0)),mini:{idx:0,seq:0,nback:0,stream:0},hist:[],
  set:{sound:true,loud:false,haptic:true,calm:false,big:false,lang:defLang,mode:'easy'},intro:false,jokers:1,fresh:-1,miniDue:false});
let S=FRESH();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.round){const f=FRESH();S={...f,...s,stats:{...f.stats,...s.stats},set:{...f.set,...s.set},mini:{...f.mini,...(s.mini||{})}};
  while(S.found.length<ALL)S.found.push(0);while(S.at.length<ALL)S.at.push(0);if(!Array.isArray(S.hist))S.hist=[];if(S.jokers===undefined)S.jokers=1;if(S.fresh===undefined)S.fresh=-1}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(!S.set.v3audio){S.set.v3audio=true;S.set.sound=true;if(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))S.set.loud=true;save()}
const need=()=>NEED[Math.min(Math.max(0,S.unlocked-2),NEED.length-1)];

/* ===================== Sprache ===================== */
let L=S.set.lang==='en'?'en':'de';

  if(typeof s==='string'&&v)s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!==undefined?v[x]:m);return s}
const loc=o=>o?(typeof o==='string'?o:(o[L]||o.de||'')):'';
const T=i=>loc((C.images[i]||{}).title)||t('imageN',{n:two(i+1)});

  document.documentElement.lang=L;

const credits=()=>PEOPLE().map(p=>loc(p.role)+': '+(p.name||'')).join(' · ');

/* ===================== Ton & Vibration =====================
   Klang: weich und warm, wie Holz und kleine Glocken. Alles wird live erzeugt,
   über einen Kompressor und einen sanften Tiefpass, damit nichts spitz klingt. */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let AC=null,OUT=null,NOISE=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.3;
    OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(lp).connect(comp).connect(AC.destination);
    const n=AC.sampleRate*.5|0;NOISE=AC.createBuffer(1,n,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  if(AC.state!=='running')AC.resume()}catch(e){}return AC}
function setSession(){try{if(navigator.audioSession){const w=S.set.loud?'playback':'ambient';if(navigator.audioSession.type!==w)navigator.audioSession.type=w}}catch(e){}}
function unlockAudio(){setSession();const a=ac();if(a&&!unlockAudio.done){try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);unlockAudio.done=true}catch(e){}}}
['touchstart','touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
const ok=()=>S.set.sound&&ac()&&OUT;
function voice(type,f,at,v,dec,f2){const a=AC,tt=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,tt);if(f2)o.frequency.exponentialRampToValueAtTime(f2,tt+dec*.6);
  g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v,tt+.004);g.gain.exponentialRampToValueAtTime(.0001,tt+dec);o.connect(g).connect(OUT);o.start(tt);o.stop(tt+dec+.05)}
/* kleine Glocke: Grundton + leiser Oberton, weich ausklingend */
function bell(f,at=0,v=.2,dec=.9){if(!ok())return;try{voice('sine',f,at,v,dec);voice('sine',f*2.01,at,v*.18,dec*.45);voice('sine',f*3.98,at,v*.06,dec*.2)}catch(e){}}
/* Holz-Tock: kurzer, tiefer Anschlag */
function tock(f=620,at=0,v=.22){if(!ok())return;try{voice('sine',f,at,v,.09,f*.66);voice('triangle',f*2.3,at,v*.12,.03)}catch(e){}}
/* Papier: gefiltertes Rauschen */
function paper(at=0,v=.12,dec=.08){if(!ok())return;try{const a=AC,tt=a.currentTime+at,src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
  src.buffer=NOISE;bp.type='bandpass';bp.frequency.setValueAtTime(1300,tt);bp.frequency.exponentialRampToValueAtTime(2800,tt+dec);bp.Q.value=.9;
  g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v,tt+.012);g.gain.exponentialRampToValueAtTime(.0001,tt+dec);
  src.connect(bp).connect(g).connect(OUT);src.start(tt,Math.random()*.3);src.stop(tt+dec+.05)}catch(e){}}
/* Kompatibel zu älteren Aufrufen: tone(Frequenz, Dauer, Lautstärke, Typ, Verzögerung) klingt jetzt als Glocke */
function tone(f,d=.3,v=.05,type,delay=0){bell(f,delay,Math.min(.3,v*3.6),Math.max(.35,d*2))}
const PENT=[587,659,784,880,988,1175];
/* Haptik: Android über vibrate, iPhone über einen versteckten Schalter (wirkt nur direkt beim Tippen) */
const canVibrate='vibrate' in navigator&&!isIOS;
let hapEl=null;
if(isIOS){try{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:-60px;top:0;width:40px;height:30px;opacity:.01;overflow:hidden;pointer-events:none';
  const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.append(i);document.body.append(l);hapEl=l}catch(e){}}
const hasHaptic=canVibrate||!!hapEl;
function buzz(p){if(!S.set.haptic)return;try{if(canVibrate)navigator.vibrate(p);else if(hapEl)hapEl.click()}catch(e){}}
const SND={
  tap:()=>{tock(640,0,.16);buzz(6)},
  flip:()=>{paper(0,.11,.07);tock(880,.005,.07)},
  match:()=>{bell(784,0,.2,.8);bell(1175,.09,.15,1)},
  miss:()=>{tock(300,0,.2);tock(250,.09,.16)},
  note:k=>bell(PENT[k%6],0,.2,.7),
  win:()=>{[587,740,880,1175].forEach((f,i)=>bell(f,i*.11,.17,1.1))},
  unlock:()=>{[440,587,659,880,988,1175].forEach((f,i)=>bell(f,i*.12,.15,1.2));bell(587,.78,.12,2.2);bell(880,.8,.1,2.2)},
  lose:()=>{bell(440,0,.16,.8);bell(330,.18,.16,1.2)}};
/* ===================== Navigation ===================== */
let view='home',pendingReload=false;
const TABS=['home','col','stats','set'];
function show(v,opts={}){
  if(v===view&&!opts.force)return;view=v;
  $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  const tab=TABS.includes(v);$('#tabs').classList.toggle('off',!tab);
  if(tab){$$('#tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===v));moveInd();if(pendingReload)return location.reload()}

function moveInd(){const b=$('#tabs button[aria-current]');if(!b)return;const r=b.getBoundingClientRect(),p=$('#tabs').getBoundingClientRect();if(r.width)$('#ind').style.transform='translateX('+(r.left-p.left+r.width/2-2.5)+'px)'}

function count(el,to,fmt=x=>x,ms=700){const from=+(el.dataset.v||0);el.dataset.v=to;if(calm()||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),step=tt=>{const k=Math.min(1,(tt-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

/* Blätter mit dem Finger nach unten wegziehen */
const DISMISS={det:()=>closeSheet('det'),about:()=>closeSheet('about'),ios:()=>closeSheet('ios'),pause:()=>$('#pGo').click(),win:()=>{const b=$('#wMap');b&&b.click()},lose:()=>$('#lMap').click()};
$$('.sheet').forEach(sh=>{const pane=sh.querySelector('.pane');if(!pane||!DISMISS[sh.id])return;let y0=null,dy=0,t0=0,sc=null,drag=false;
  pane.addEventListener('touchstart',e=>{sc=e.target.closest('.dscroll')||(pane.scrollHeight>pane.clientHeight+2?pane:null);if(sc&&sc.scrollTop>0){y0=null;return}

    e.preventDefault();pane.style.transition='none';pane.style.transform='translateY('+Math.max(0,dy)+'px)'},{passive:false});
  pane.addEventListener('touchend',()=>{if(y0===null)return;y0=null;pane.style.transition='';const v=dy/Math.max(1,Date.now()-t0);
    if(drag&&(dy>110||v>.65)){pane.style.transform='translateY(105%)';setTimeout(()=>{pane.style.transform=''},520);DISMISS[sh.id]()}else pane.style.transform='';drag=false},{passive:true})});

/* ===================== Start: der Weg ===================== */
let P=[],gapY=168,lit=new Set(),raf=0;
function renderHome(opts={}){
  $('#roundChip').textContent=t('round',{n:S.round});
  const done=S.unlocked>=ALL,n=need(),left=n-S.prog,st=stage();
  $('#stTxt').textContent=done?t('masterStatus',{n:Math.min(STAGE_RULES.length,Math.floor(S.master/2)+1),of:STAGE_RULES.length,name:st.name}):(left===1?t('until1',{n:S.unlocked+1}):t('untilN',{r:left,n:S.unlocked+1}));
  $('#pips').innerHTML=done?Array.from({length:2},(_,j)=>'<i class="'+(j<S.master%2?'on':'')+'"></i>').join(''):Array.from({length:n},(_,j)=>'<i class="'+(j<S.prog?'on':'')+(opts.pip===j?' pop':'')+(j===n-1?' m':'')+'"></i>').join('');
  const mn=masterNext();setSerious(mn);
  if(mn){const g=gateRule(S.unlocked+1);$('#stTxt').textContent=t('gateNext',{name:g.name,n:S.unlocked+1});$('#playTxt').textContent=t('gatePlay',{name:g.name})}
  else $('#playTxt').textContent=t('playPairs',{n:Math.min(S.unlocked,MAXP)});
  $('#miniBtn').classList.toggle('due',!!S.miniDue);
  renderMap(opts.enter!==false);
}
function renderMap(enter){
  const map=$('#map'),inn=$('#mapIn'),W=map.clientWidth||360,gap=200,pad=90,cnt=Math.min(ALL,S.unlocked+3);gapY=gap;
  const H=pad*2+gap*(cnt-1);inn.style.height=H+'px';P=[];
  for(let i=0;i<cnt;i++)P.push([W/2+(i%2?1:-1)*W*.2,H-pad-i*gap]);
  const seg=(a,b)=>{const my=(a[1]+b[1])/2;return 'M'+a[0]+' '+a[1]+'C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]};
  let svg='<svg width="'+W+'" height="'+H+'" aria-hidden="true">';
  for(let i=1;i<cnt;i++){const c=i<S.unlocked?'p-done':i===S.unlocked?'p-next':'p-fut';svg+='<path class="'+c+'" data-s="'+i+'" d="'+seg(P[i-1],P[i])+'"/>'}
  /* Runden als Punkte auf jedem Wegstück */
  const tmp=document.createElementNS('http://www.w3.org/2000/svg','path'),mpos=[];
  for(let i=2;i<cnt;i++){const n=NEED[Math.min(i-2,NEED.length-1)];tmp.setAttribute('d',seg(P[i-1],P[i]));let L=0;try{L=tmp.getTotalLength()}catch(e){}if(!L)break;
    for(let j=0;j<n;j++){const fr=j===n-1?.565:.25+.22*(n>2?j/(n-2):.5),pt=tmp.getPointAtLength(L*fr),cur=i===S.unlocked,on=i<S.unlocked||(cur&&j<S.prog);
      const m=j===n-1;if(m){mpos.push([pt.x,pt.y,i,cur,on]);
        svg+=(cur?'<circle class="mring" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="6"/>':'')+'<circle class="mo'+(i>S.unlocked?' fut':'')+'" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="10.5"/><circle data-s="'+i+'" class="rd m'+(on?' on':'')+(i>S.unlocked?' fut':'')+'" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="6.5"/>'+(on?'<circle class="rd mi" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="2.2"/>':'');continue}
      svg+='<circle data-s="'+i+'" class="rd'+(on?' on':'')+(cur?' cur':'')+(i>S.unlocked?' fut':'')+'" cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="'+(cur?4.5:3.5)+'"/>'}}
  let h='';
  mpos.forEach(([x,y,i,cur,on])=>{const g=gateRule(i+1);h+='<div class="shade'+(cur?' cur':'')+'" style="left:'+x+'px;top:'+y+'px;opacity:'+(i>S.unlocked?.5:1)+'"></div>'})
  h+=svg+'</svg>';
  const DK=((C.deko||{}).ornamente||[]).map(o=>typeof o==='string'?o:o.datei).filter(Boolean);
  for(let i=0;i<cnt-1&&DK.length;i++){const y=(P[i][1]+P[i+1][1])/2-20,left=i%2===0;

function setBtns(l1,f1,l2,f2){const a=$('#mSkip'),b=$('#mBtn');a.hidden=!l1;a.textContent=l1||'';a.onclick=f1?()=>{SND.tap();f1()}:null;b.hidden=!l2;b.textContent=l2||'';b.onclick=f2||null}
function leaveMini(){mStop();const f=afterMini;afterMini=null;f?f():show('home',{enter:false})}
$('#mBack').onclick=()=>{SND.tap();leaveMini()};
$('#miniBtn').onclick=()=>{SND.tap();S.miniDue=false;save();openMini(S.mini.idx||0)};
function endMini(score,detail){mStop();$('#mStage').onclick=null;const k=mg.key,rec=score>(S.mini[k]||0);if(rec)S.mini[k]=score;S.mini.idx=(mg.i+1)%3;save();
  $('#mStat').innerHTML='';
  $('#mStage').innerHTML='<div class="mres" role="status"><span class="cap">'+esc(mg.unit)+'</span><b class="num">'+fmtScore(k,score)+'</b><span>'+esc(detail)+'</span>'+(rec&&score>0?'<span class="rec">'+esc(t('newBest'))+'</span>':'<span>'+esc(t('best',{v:fmtScore(k,S.mini[k]||0)}))+'</span>')+'</div>';
  rec&&score>0?SND.win():SND.tap();
  setBtns(null,null,afterMini?t('continueRound',{n:S.round}):t('done'),()=>{SND.tap();leaveMini()})}
function runSeq(){
  const ims=pool(Math.min(S.unlocked,6)),cols=ims.length===4?2:Math.min(3,ims.length);
  $('#mStage').innerHTML='<div class="sgrid" style="grid-template-columns:repeat('+cols+',1fr);max-width:'+(cols===2?280:340)+'px">'+ims.map((im,k)=>'<button data-k="'+k+'" aria-label="'+esc(T(im))+'"><img src="'+IMGS[im]+'" alt=""></button>').join('')+'</div>';
  setBtns(null,null,null,null);
  const grid=$('#mStage .sgrid'),btns=[...grid.children];let seq=[],pos=0,input=false,len=3;
  const stat=ph=>$('#mStat').innerHTML='<span>'+esc(t('lengthN',{n:len}))+'</span><span>·</span><span>'+esc(ph)+'</span>';
  const light=(k,ms)=>{btns[k].classList.add('lit');SND.note(k);mLater(()=>btns[k].classList.remove('lit'),ms)};
  function play(){input=false;pos=0;grid.classList.add('dim');stat(t('watch'));while(seq.length<len)seq.push(Math.floor(Math.random()*btns.length));
    const sp=Math.max(380,650-len*25);seq.forEach((k,i)=>mLater(()=>light(k,sp-120),600+i*sp));
    mLater(()=>{grid.classList.remove('dim');input=true;stat(t('yourTurn'))},600+seq.length*sp)}
  btns.forEach((b,k)=>b.onclick=()=>{if(!input)return;light(k,220);
    if(seq[pos]!==k){input=false;b.classList.add('bad');SND.miss();mLater(()=>endMini(len-1,t('longest')),900);return}
    pos++;if(pos===seq.length){input=false;SND.match();if(len>=14)return mLater(()=>endMini(len,t('maxReached')),700);len++;mLater(play,800)}});
  play()}
function runNback(){
  const ims=pool(Math.min(S.unlocked,4)),N=22,seq=[];
  for(let i=0;i<N;i++){if(i>=2&&Math.random()<.33)seq.push(seq[i-2]);else{let v;do{v=ims[Math.floor(Math.random()*ims.length)]}while(i>=2&&v===seq[i-2]);seq.push(v)}}
  let i=-1,tapped=false,hit=0,miss=0,fa=0,cr=0;
  $('#mStage').innerHTML='<div class="blank" aria-hidden="true">2</div>';
  const stat=()=>$('#mStat').innerHTML='<span>'+esc(t('progressN',{i:Math.max(0,i+1),n:N}))+'</span><span>·</span><span>'+esc(t('hits',{n:hit}))+'</span>';
  setBtns(null,null,t('same'),()=>{if(i<2||tapped)return;tapped=true;const img=$('#mStage img');
    if(seq[i]===seq[i-2]){hit++;img&&img.classList.add('ok');SND.match()}else{fa++;img&&img.classList.add('ko');SND.miss()}stat()});
  function next(){if(i>=2&&!tapped){if(seq[i]===seq[i-2])miss++;else cr++}i++;tapped=false;
    if(i>=N){const tot=hit+miss+fa+cr;return endMini(tot?Math.round((hit+cr)/tot*100):0,t('nbackDetail',{h:hit,m:miss,f:fa}))}
    $('#mStage').innerHTML='<img class="flash" src="'+IMGS[seq[i]]+'" alt="'+esc(T(seq[i]))+'">';stat();SND.flip();
    mLater(()=>{$('#mStage').innerHTML='<div class="blank" aria-hidden="true"></div>'},1500);mLater(next,1950)}
  stat();mLater(next,700)}
function runStream(){
  const ims=pool(Math.min(S.unlocked,6)),target=ims[0],N=26,seq=[];
  for(let i=0;i<N;i++)seq.push(i>1&&Math.random()<.28?target:ims[1+Math.floor(Math.random()*(ims.length-1))]);if(!seq.includes(target))seq[N-3]=target;
  let i=-1,shownAt=0,tapped=false,hit=0,miss=0,fa=0,rts=[];
  const tgt='<span>'+esc(t('target'))+'</span><img src="'+IMGS[target]+'" alt="'+esc(T(target))+'">';
  $('#mStat').innerHTML=tgt;$('#mStage').innerHTML='<img class="flash" src="'+IMGS[target]+'" alt="'+esc(T(target))+'">';
  setBtns(null,null,t('rememberT'),null);
  const stat=()=>$('#mStat').innerHTML=tgt+'<span>·</span><span>'+esc(t('progressN',{i:Math.max(0,i+1),n:N}))+'</span><span>·</span><span>'+esc(t('hits',{n:hit}))+'</span>';
  const tap=()=>{if(i<0||tapped)return;tapped=true;const img=$('#mStage img');
    if(seq[i]===target){hit++;rts.push(Date.now()-shownAt);img&&img.classList.add('ok');SND.match()}else{fa++;img&&img.classList.add('ko');SND.miss()}stat()};
  function next(){if(i>=0&&!tapped&&seq[i]===target)miss++;i++;tapped=false;
    if(i>=N){const rt=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):0,score=Math.max(0,hit*100-fa*60-miss*40+(rt?Math.max(0,700-rt):0));
      return endMini(score,t('streamDetail',{h:hit,f:fa})+(rt?t('avgMs',{ms:rt}):''))}
    const dur=Math.round(1050-(i/N)*560);$('#mStage').innerHTML='<img class="flash" src="'+IMGS[seq[i]]+'" alt="'+esc(T(seq[i]))+'">';shownAt=Date.now();stat();mLater(next,dur)}
  mLater(()=>{setBtns(null,null,t('now'),tap);$('#mStage').onclick=tap;stat();next()},2200)}

/* ===================== Sammlung & Bild-Detail ===================== */
function renderCol(){
  $('#colChip').textContent=S.unlocked+' / '+ALL;
  $('#credit').innerHTML=creditCard();const cb=$('#creditBtn');if(cb)cb.onclick=()=>{SND.tap();openAbout()};
  $('#grid').innerHTML=IMGS.map((src,i)=>i<S.unlocked
    ?'<button class="cell in" data-i="'+i+'" style="animation-delay:'+(i*.04)+'s" aria-label="'+esc(t('stationAria',{n:i+1,title:T(i)}))+'"><span class="c"><img src="'+src+'" alt=""></span><span class="l" aria-hidden="true"><b>'+two(i+1)+'</b>'+esc(T(i))+'</span></button>'
    :'<div class="cell lock in" style="animation-delay:'+(i*.04)+'s" role="img" aria-label="'+esc(t('lockedAria',{n:i+1}))+'"><span class="c" aria-hidden="true">'+two(i+1)+'</span><span class="l" aria-hidden="true">'+esc(t('hidden'))+'</span></div>').join('');
  $$('#grid .cell[data-i]').forEach(b=>b.onclick=()=>{SND.tap();openDetail(+b.dataset.i,b.querySelector('.c'))});
}
function openDetail(i,from){
  const story=STORY(i),step=STEP(i);
  $('#detPane').innerHTML='<div class="grip"></div><div class="dscroll" id="dScroll"><div class="detail">'+
    '<div class="dnav"><button class="key" id="dPrev" aria-label="'+esc(t('prev'))+'"'+(i<1?' disabled style="opacity:.3"':'')+'><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+
    '<div class="big" id="dBig"><img src="'+IMGS[i]+'" alt="'+esc(T(i))+'"></div>'+
    '<button class="key" id="dNext" aria-label="'+esc(t('nextImg'))+'"'+(i>=S.unlocked-1?' disabled style="opacity:.3"':'')+'><svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>'+
    '<span class="cap">'+esc(t('imageOf',{n:two(i+1),of:ALL}))+'</span><h2>'+esc(T(i))+'</h2>'+
    '<div class="meta cap">'+(PEOPLE()[0]?'<span>'+esc(t('drawnBy',{name:PEOPLE()[0].name}))+'</span>':'')+(S.at[i]?'<span>'+esc(t('unlockedIn',{n:S.at[i]}))+'</span>':'')+'<span>'+esc(t('foundTimes',{n:S.found[i]||0}))+'</span></div>'+
    '<div class="txt">'+(step?'<p class="q">'+esc(step)+'</p>':'')+(story?'<p>'+esc(story)+'</p>':'')+'</div></div></div>'+
    '<button class="btn g" id="dClose" style="margin-top:8px;width:100%;flex:none">'+esc(t('close'))+'</button>';
  const sh=$('#det'),was=sh.classList.contains('on');openSheet('det');
  if(from&&!was&&!calm()){const big=$('#dBig');big.style.visibility='hidden';
    setTimeout(()=>{const a=from.getBoundingClientRect(),b=big.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.innerHTML='<img src="'+IMGS[i]+'" alt="">';
      Object.assign(f.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});document.body.append(f);
      const sx=a.width/b.width,dx=a.left+a.width/2-(b.left+b.width/2),dy=a.top+a.height/2-(b.top+b.height/2);
      f.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+')'},{transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.9,.25,1)'}).onfinish=()=>{big.style.visibility='';f.remove()}},80)}
  else if(was&&!calm())$('#dBig').animate([{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
  $('#dClose').onclick=()=>closeSheet('det');
  $('#dPrev').onclick=()=>{if(i>0){SND.tap();openDetail(i-1)}};$('#dNext').onclick=()=>{if(i<S.unlocked-1){SND.tap();openDetail(i+1)}};
}

/* ===================== Statistik ===================== */
function renderStats(){
  const s=S.stats;count($('#sWon'),s.won);count($('#sPairs'),s.pairs);count($('#sStreak'),s.bestStreak);
  if(s.moves)count($('#sAcc'),Math.round(s.pairs/s.moves*100),v=>v+' %');else $('#sAcc').textContent='–';
  $('#starChip').textContent='● '+(s.stars||0)+' '+t('kStars');
  const h=S.hist.slice(-10);
  if(h.length){const mx=Math.max(...h),mn=Math.min(...h);$('#bars').innerHTML=h.map((v,k)=>'<i class="'+(v===mn?'best':'')+'" style="height:'+(20+v/mx*80)+'%;transition-delay:'+(k*.05)+'s" title="'+v+'"></i>').join('')}
  else $('#bars').innerHTML='<span class="cap" style="margin:auto">–</span>';
  const c=$('#chart');c.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('on')));
  $('#bests').innerHTML=[2,3,4,5,6,7,8].map(p=>{const b=S.best[p];return '<div><span>'+esc(t('pairsN',{n:p}))+'</span><em>'+(b?mmss(b.t)+' · '+esc(t('movesN',{n:b.m})):'–')+'</em></div>'}).join('');
  const mn=t('minis');$('#minis').innerHTML='<div><span>'+esc(mn[0].name)+'</span><em>'+(S.mini.seq?esc(t('lengthN',{n:S.mini.seq})):'–')+'</em></div><div><span>'+esc(mn[1].name)+'</span><em>'+(S.mini.nback?S.mini.nback+' %':'–')+'</em></div><div><span>'+esc(mn[2].name)+'</span><em>'+(S.mini.stream?esc(t('pointsN',{n:S.mini.stream})):'–')+'</em></div>';
}

/* ===================== Optionen ===================== */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='set')renderSet()});
function segSet(el,attr,val){$$('#'+el+' button').forEach(b=>b.setAttribute('aria-checked',b.dataset[attr]===val));$('#'+el).classList.toggle('r',$$('#'+el+' button')[1].dataset[attr]===val)}
function renderSet(){
  $$('[data-k]').forEach(b=>b.setAttribute('aria-checked',!!S.set[b.dataset.k]));
  segSet('mode','m',S.set.mode);segSet('lang','l',L);
  $('#modeNote').textContent=PRO()?t('modeNotePro'):t('modeNoteEasy');
  $('#hapRow').hidden=!hasHaptic;$('#hapSub').textContent=isIOS?t('hapticIOS'):t('hapticSub');$('#loudRow').hidden=!isIOS;
  $('#installRow').hidden=standalone||(!installEvt&&!isIOS);$('#devRow').hidden=!DEV;
}
$$('[data-k]').forEach(b=>b.onclick=()=>{S.set[b.dataset.k]=!S.set[b.dataset.k];save();applySet();renderSet();SND.tap()});
$$('#mode button').forEach(b=>b.onclick=()=>{S.set.mode=b.dataset.m;save();renderSet();SND.tap()});
$$('#lang button').forEach(b=>b.onclick=()=>{S.set.lang=L=b.dataset.l;save();applyLang();renderSet();SND.tap()});
function applySet(){const r=document.documentElement;r.classList.toggle('calm',!!S.set.calm);r.classList.toggle('big',!!S.set.big);setSession();requestAnimationFrame(moveInd)}
$('#installRow').onclick=async()=>{SND.tap();if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;renderSet()}else openSheet('ios')};
$('#iosOk').onclick=()=>closeSheet('ios');
$('#introRow').onclick=()=>{SND.tap();openIntro()};
$('#aboutRow').onclick=()=>{SND.tap();openAbout()};
function ask(title,text,ok,fn){$('#askT').textContent=title;$('#askP').textContent=text;$('#askOk').textContent=ok;$('#askOk').onclick=()=>{closeSheet('ask');fn()};openSheet('ask')}
$('#askNo').onclick=()=>closeSheet('ask');
$('#resetRow').onclick=()=>{SND.tap();ask(t('resetTitle'),t('resetText'),t('resetOk'),()=>{const keep=S.set;S=FRESH();S.set=keep;S.intro=true;save();show('home',{force:true})})};
$('#devRow').onclick=()=>ask(t('devTitle'),t('devText'),t('devOk'),()=>{S.unlocked=ALL;S.prog=0;S.at=S.at.map((v,i)=>v||i+1);save();show('home',{force:true})});

/* ===================== Über das Projekt ===================== */
const avatar=(p,k)=>'<span class="av'+(k===0?' a':'')+'" aria-hidden="true">'+(p.portrait?'<img src="'+esc(p.portrait)+'" alt="">':esc(p.signature||(p.name||'').split(' ').map(w=>w[0]).join('')))+'</span>';
function openAbout(){
  const P=PEOPLE(),pr=C.project||{},tx=loc(pr.text),steps=(pr.steps||[]).map(loc).filter(Boolean);
  $('#aboutPane').innerHTML='<div class="grip"></div><div class="dscroll">'+
    '<span class="cap">'+esc(loc(pr.title)||t('about'))+'</span>'+
    '<div class="duo" style="margin:14px 0 10px">'+P.map((p,k)=>avatar(p,k)).join('<span class="x">×</span>')+'</div>'+
    '<div class="names">'+P.map(p=>esc(p.name)).join('<span>×</span>')+'</div>'+
    (loc(pr.lead)?'<p class="ptext" style="color:var(--ink);margin-bottom:10px">'+esc(loc(pr.lead))+'</p>':'')+(tx?'<p class="ptext">'+esc(tx)+'</p>':'')+
    (steps.length?'<span class="cap">'+esc(t('howMade'))+'</span><div class="steps">'+steps.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>':'')+
    '<div class="strip" aria-hidden="true">'+IMGS.slice(0,S.unlocked).map(s=>'<img src="'+s+'" alt="">').join('')+'</div>'+
    P.map((p,k)=>{const ln=p.link||'';return '<div class="person">'+avatar(p,k)+'<div><span class="cap">'+esc(loc(p.role))+'</span><h3>'+esc(p.name)+'</h3>'+(loc(p.bio)?'<p>'+esc(loc(p.bio))+'</p>':'')+
      (ln?'<a href="'+esc(ln)+'" target="_blank" rel="noopener">'+esc(ln.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))+' ↗</a>':'')+'</div></div>'}).join('')+
    '<p class="copy">'+esc(copyLine())+'. '+esc(loc((C.copyright||{}).note))+'</p></div>'+
    '<button class="btn g" id="aClose" style="width:100%;margin-top:8px;flex:none">'+esc(t('close'))+'</button>';
  openSheet('about');$('#aClose').onclick=()=>closeSheet('about');
}
function creditCard(){const P=PEOPLE();if(!P.length)return '';
  return '<button class="credit" id="creditBtn"><span class="duo">'+P.map((p,k)=>avatar(p,k)).join('')+'</span><span><b>'+P.map(p=>esc(p.name)).join(' × ')+'</b><small>'+esc(P.map(p=>loc(p.role)).join(' · '))+'</small></span><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>'}

/* ===================== Prolog & Einführung ===================== */
let slide=0;const SLIDES=4;
function openIntro(){
  const pro=loc(C.journey&&C.journey.prologue)||'';$('#pro1').textContent=pro.replace(/^Es war einmal eine Welt aus Tusche\.?\s*/,'').replace(/^Once upon a time[^.]*\.\s*/,'')||pro;
  $('#iCircles').innerHTML=[0,1,2,3].filter(i=>i<ALL).map((i,k)=>'<img src="'+IMGS[i]+'" alt="" style="animation-delay:'+(.2+k*.08)+'s">').join('');
  segSet('iMode','m',S.set.mode);$('#iModeNote').textContent=PRO()?t('modeNotePro'):t('modeNoteEasy');
  $('#pCredit').textContent=t('projectBy',{names:PEOPLE().map(p=>p.name).join(' × ')});
  slide=0;drawSlide();$('#intro').classList.remove('out')}
function drawSlide(){$$('.slide').forEach((s,k)=>{s.classList.toggle('on',k===slide);s.classList.toggle('past',k<slide)});$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===slide));
  $('#iNext').textContent=slide===SLIDES-1?t('letsGo'):t('continue')}
function endIntro(){$('#intro').classList.add('out');S.intro=true;save();show('home',{force:true})}
$('#iNext').onclick=()=>{SND.tap();if(slide<SLIDES-1){slide++;drawSlide()}else endIntro()};
$('#iSkip').onclick=()=>{SND.tap();endIntro()};
$$('#iMode button').forEach(b=>b.onclick=()=>{S.set.mode=b.dataset.m;save();segSet('iMode','m',S.set.mode);$('#iModeNote').textContent=PRO()?t('modeNotePro'):t('modeNoteEasy');SND.tap()});
/* Wischen in der Einführung */
let sx0=null;$('#intro').addEventListener('touchstart',e=>{sx0=e.touches[0].clientX},{passive:true});
$('#intro').addEventListener('touchend',e=>{if(sx0===null)return;const dx=e.changedTouches[0].clientX-sx0;sx0=null;if(Math.abs(dx)<50)return;
  if(dx<0&&slide<SLIDES-1){slide++;drawSlide()}else if(dx>0&&slide>0){slide--;drawSlide()}},{passive:true});

/* ===================== Offline & Updates ===================== */
const busy=()=>view==='game'||view==='mini';
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{setInterval(()=>reg.update().catch(()=>{}),30*60*1000)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}if(busy()){pendingReload=true;$('#toast').classList.add('on')}else location.reload()});
}
$('#toastBtn').onclick=()=>location.reload();

/* ===================== Start ===================== */
sizeApp();applyLang();applySet();
const startView={'#sammlung':'col','#statistik':'stats','#optionen':'set'}[location.hash]||'home';
show(startView,{force:true});
if(!S.intro)openIntro();
document.fonts&&document.fonts.ready.then(()=>{moveInd();if(view==='home')renderMap(false)});
</script>
